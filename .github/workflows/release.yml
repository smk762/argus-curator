name: Release to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-install:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install wheel and smoke-test import
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install dist/*.whl
          uv run --no-sync python -c "from argus_curator import scan_folder, __version__; print(f'argus-curator {__version__} OK')"
      # The base import never touches server/app.py, so it cannot catch a broken
      # server dependency edge (argus-cortex is resolved from PyPI at install
      # time and can move between the last green CI run and a tag push). Import
      # the server module too, so a missing or renamed argus_cortex.server fails
      # here rather than on the user's first `argus-curator serve`.
      - name: Smoke-test the server extra
        run: |
          uv pip install "$(echo dist/*.whl)[server]"
          uv run --no-sync python -c "from argus_curator.server.app import create_app; create_app(); print('argus-curator[server] OK')"

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: test-install
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    runs-on: ubuntu-latest
    # Ordered *after* the TestPyPI rehearsal so its outcome is visible first, but
    # deliberately not gated on it. A TestPyPI-only fault — a missing trusted
    # publisher, an index outage — must not silently withhold the real release:
    # that failure mode shipped argus-proof images for two tags with no wheel on
    # PyPI, and nothing surfaced it because publish-image is independent.
    # Only the build + install gate is required; a TestPyPI failure still marks
    # the whole run failed, so the problem stays loud.
    needs: [test-install, publish-testpypi]
    if: "!cancelled() && needs.test-install.result == 'success'"
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-image:
    runs-on: ubuntu-latest
    needs: test-install
    # The CPU image keeps its tags; the CUDA build (GPU=1) is the same tags with
    # "-gpu" (0.10.0-gpu, 0.10-gpu, latest-gpu).
    strategy:
      matrix:
        include:
          - gpu: "0"
            suffix: ""
          - gpu: "1"
            suffix: "-gpu"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-curator
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # The package version, from the tag: meta's version carries the "-gpu" suffix.
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The base image has no git, so pass the version in via build-arg
      # (SETUPTOOLS_SCM_PRETEND_VERSION) rather than relying on .git history.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GPU=${{ matrix.gpu }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=image${{ matrix.suffix }}

  github-release:
    runs-on: ubuntu-latest
    # A GitHub Release per tag, so the repo's "Latest" tracks what is actually
    # installable. Ordered after PyPI accepted the upload: a Release must never
    # advertise a version pip cannot fetch. Tags alone do not show up as
    # Releases, which is how v0.2.1 and v0.3.0 went unlisted.
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the tag's CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Re-running a release workflow must not fail on, or overwrite, a
          # Release that was already created (or hand-edited) for this tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
            exit 0
          fi
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md \
            | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no [$version] section; add one and re-run this job."
            exit 1
          fi
          printf '\n**Full changelog:** %s/%s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
