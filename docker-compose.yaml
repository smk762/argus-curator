services:
  argus-curator:
    build:
      context: .
      args:
        # The CUDA image (the services below reserve the GPU for it). CURATOR_GPU=0
        # in .env builds the CPU image instead, for a host with no NVIDIA runtime.
        GPU: ${CURATOR_GPU:-1}
    ports:
      - "${CURATOR_PORT:-8101}:8101"
    environment:
      - CURATOR_SOURCE_PATH=/data/images
      - CURATOR_EXPORT_PATH=/data/out
      - CURATOR_CACHE_DIR=/root/.cache/argus_curator/scans
      - HF_HOME=/root/.cache/huggingface
      # Browser origins allowed to call the API (defaults to localhost:3000).
      # - CURATOR_CORS_ORIGINS=https://studio.example.com
      # Face-attribute ONNX models (see `argus-curator fairface-convert` / `mivolo-convert`).
      - ARGUS_CURATOR_FAIRFACE_MODEL=/root/.cache/argus_curator/models/fairface_res34_race7.onnx
      - ARGUS_CURATOR_MIVOLO_MODEL=/root/.cache/argus_curator/models/mivolo_v2_d1_384.onnx
      # Places365 scene tags (see `argus-curator places365-convert`).
      - ARGUS_CURATOR_PLACES365_MODEL=/root/.cache/argus_curator/models/places365_resnet18.onnx
      # Fashionpedia garment detector (see `argus-curator garments-convert`).
      - ARGUS_CURATOR_GARMENTS_MODEL=/root/.cache/argus_curator/models/yolos_fashionpedia.onnx
      # NudeNet nudity check, on by default (opt-out). Unset: the nudenet service
      # below. Point it at a shared argus-retina server in .env (e.g.
      # http://<LAN_HOST>:8130) and run `docker compose up -d argus-curator` to
      # leave the bundled one stopped, or set it empty (ARGUS_CURATOR_NUDENET_URL=)
      # to switch the check off.
      - ARGUS_CURATOR_NUDENET_URL=${ARGUS_CURATOR_NUDENET_URL-http://nudenet:8080}
      # SingGuard policy check, off unless .env sets a URL (no server is bundled:
      # it runs a vision language model). Opt-out once set, like NudeNet.
      - ARGUS_CURATOR_SINGGUARD_URL=${ARGUS_CURATOR_SINGGUARD_URL-}
      # cascade: fast on every frame, slow only on what fast flags (slow's verdict stands).
      - ARGUS_CURATOR_SINGGUARD_THINKING=${ARGUS_CURATOR_SINGGUARD_THINKING-cascade}
      # What the scan already knows, sent as recorded context. Empty sends the image alone.
      - ARGUS_CURATOR_SINGGUARD_CONTEXT=${ARGUS_CURATOR_SINGGUARD_CONTEXT-age,folder,caption,scene}
      # Under-18 rule: frame (a young age and any exposure in the frame) or overlap
      # (the exposure must sit on the young person's box). Anything else stops the start.
      - ARGUS_CURATOR_MINOR_EXPOSED=${ARGUS_CURATOR_MINOR_EXPOSED:-frame}
      # Uncomment to permit destructive mode="move" exports.
      # - CURATOR_ALLOW_MOVE=1
      # Share the GPU with other argus services (argus-lens) one job at a time,
      # each starting only once the card has room (argus_cortex.gpu). Every
      # service on the host must mount the same host directory (ARGUS_GPU_LOCK_DIR,
      # below) and name the same lock file in it. ARGUS_GPU_COORDINATOR=none in
      # .env turns it off. A CPU build (CURATOR_GPU=0) never takes the lease.
      - ARGUS_GPU_COORDINATOR=${ARGUS_GPU_COORDINATOR:-lease}
      - ARGUS_GPU_LEASE_PATH=/run/argus-gpu/argus-gpu.lock
      - ARGUS_GPU_LEASE_TIMEOUT_S=${ARGUS_GPU_LEASE_TIMEOUT_S:-300}
      # ARGUS_GPU_COORDINATOR=broker asks argus-iris instead (docs/gpu.md),
      # falling back to the lease above while iris cannot be reached.
      - ARGUS_GPU_BROKER_URL=${ARGUS_GPU_BROKER_URL-}
      - ARGUS_GPU_BROKER_TOKEN=${ARGUS_GPU_BROKER_TOKEN-}
      - ARGUS_GPU_TENANT_MANIFEST=${ARGUS_GPU_TENANT_MANIFEST:-/app/gpu-tenant.yaml}
      - ARGUS_GPU_BROKER_FALLBACK=${ARGUS_GPU_BROKER_FALLBACK:-lease}
      # DNS names a browser UI reaches curator by (comma-separated), whose
      # same-host writes the write-guard allows. IPs and localhost need none.
      - CURATOR_TRUSTED_HOSTS=${CURATOR_TRUSTED_HOSTS-}
    volumes:
      # Dataset mount the curator scans and serves /thumb from.
      - ${CURATOR_SOURCE_PATH:-./data}:/data/images
      # Output mount for exported datasets + manifests.
      - ${CURATOR_OUTPUT_PATH:-./out}:/data/out
      # Persist scan cache + InsightFace model downloads across rebuilds.
      - ~/.cache/argus_curator:/root/.cache/argus_curator
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.insightface:/root/.insightface
      # The host-wide GPU lease's lock directory, shared by every argus service.
      - ${ARGUS_GPU_LOCK_DIR:-/tmp/argus-gpu}:/run/argus-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # NudeNet 640m (AGPL-3.0), the suite's shared detector image from argus-retina:
  # the same image the shared LAN servers run, so scores match them. Curator only
  # talks to it over HTTP. CPU only. Reachable from curator as http://nudenet:8080;
  # no port is published. /infer answers 503 until the model loads (/health says
  # "loading"); the image's HEALTHCHECK waits for it.
  nudenet:
    image: ghcr.io/smk762/argus-retina-nudenet:0.1.0@sha256:cbdc2d47171bf08f521981e0a962532ee2a25c4773f423e7eab2d36838f1adef
    restart: unless-stopped
