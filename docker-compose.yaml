services:
  argus-curator:
    build:
      context: .
      args:
        # The CUDA image (the services below reserve the GPU for it). CURATOR_GPU=0
        # in .env builds the CPU image instead, for a host with no NVIDIA runtime.
        GPU: ${CURATOR_GPU:-1}
    ports:
      - "${CURATOR_PORT:-8101}:8101"
    environment:
      - CURATOR_SOURCE_PATH=/data/images
      - CURATOR_EXPORT_PATH=/data/out
      - CURATOR_CACHE_DIR=/root/.cache/argus_curator/scans
      - HF_HOME=/root/.cache/huggingface
      # Browser origins allowed to call the API (defaults to localhost:3000).
      # - CURATOR_CORS_ORIGINS=https://studio.example.com
      # Face-attribute ONNX models (see `argus-curator fairface-convert` / `mivolo-convert`).
      - ARGUS_CURATOR_FAIRFACE_MODEL=/root/.cache/argus_curator/models/fairface_res34_race7.onnx
      - ARGUS_CURATOR_MIVOLO_MODEL=/root/.cache/argus_curator/models/mivolo_v2_d1_384.onnx
      # Places365 scene tags (see `argus-curator places365-convert`).
      - ARGUS_CURATOR_PLACES365_MODEL=/root/.cache/argus_curator/models/places365_resnet18.onnx
      # Fashionpedia garment detector (see `argus-curator garments-convert`).
      - ARGUS_CURATOR_GARMENTS_MODEL=/root/.cache/argus_curator/models/yolos_fashionpedia.onnx
      # NudeNet nudity check, on by default (opt-out). Unset: the nudenet service
      # below. Point it elsewhere in .env (e.g. a LAN host running the same
      # image), or set it empty (ARGUS_CURATOR_NUDENET_URL=) to switch it off.
      - ARGUS_CURATOR_NUDENET_URL=${ARGUS_CURATOR_NUDENET_URL-http://nudenet:8080}
      # SingGuard policy check, off unless .env sets a URL (no server is bundled:
      # it runs a vision language model). Opt-out once set, like NudeNet.
      - ARGUS_CURATOR_SINGGUARD_URL=${ARGUS_CURATOR_SINGGUARD_URL-}
      - ARGUS_CURATOR_SINGGUARD_THINKING=${ARGUS_CURATOR_SINGGUARD_THINKING-fast}
      # Uncomment to permit destructive mode="move" exports.
      # - CURATOR_ALLOW_MOVE=1
      # Share the GPU with other argus services (argus-lens) one job at a time,
      # each starting only once the card has room (argus_cortex.gpu). Every
      # service must name the same lock file on the same host directory: uncomment
      # this and the matching volume below. A CPU build (CURATOR_GPU=0) never
      # takes the lease.
      # - ARGUS_GPU_COORDINATOR=lease
      # - ARGUS_GPU_LEASE_PATH=/run/argus-gpu/argus-gpu.lock
    volumes:
      # Dataset mount the curator scans and serves /thumb from.
      - ${CURATOR_SOURCE_PATH:-./data}:/data/images
      # Output mount for exported datasets + manifests.
      - ${CURATOR_OUTPUT_PATH:-./out}:/data/out
      # Persist scan cache + InsightFace model downloads across rebuilds.
      - ~/.cache/argus_curator:/root/.cache/argus_curator
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.insightface:/root/.insightface
      # The host-wide GPU lease's lock directory, shared by every argus service.
      # - ${ARGUS_GPU_LOCK_DIR:-/tmp/argus-gpu}:/run/argus-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # NudeNet detector server (AGPL-3.0, notAI-tech/NudeNet). Curator only talks to
  # it over HTTP. Pinned by digest because upstream publishes only `latest`.
  # Reachable from curator as http://nudenet:8080; no port is published.
  nudenet:
    image: ghcr.io/notai-tech/nudenet@sha256:5d8fb3a20980680b73b7776745ee5b1983851c201a706cbdf3dd827c143783e9
    # The image's start command runs `ulimit -n 1000000 && <worker> & <api>`.
    # Where Docker's default limit is lower that ulimit fails, the inference
    # worker never starts and the API waits for warmup forever.
    ulimits:
      nofile: 1000000
    restart: unless-stopped
