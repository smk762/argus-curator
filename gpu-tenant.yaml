# argus-curator's GPU use, for the argus-iris broker (argus_cortex.gpu_wire.TenantManifest,
# validated against cortex's gpu-tenant-schema.json by tests/test_gpu_tenant.py).
#
# Read when ARGUS_GPU_COORDINATOR=broker and ARGUS_GPU_TENANT_MANIFEST names this file
# (/app/gpu-tenant.yaml in the image). Each kind is a model curator runs in its own
# process (runtime.gpu_lease passes the model as the kind). vram_mb is the load ask
# plus one image's (or one speech window's) run ask from runtime.VRAM_MB, and model_mb the load ask: the
# weights that stay loaded between leases.
#
# Scans take the kinds' batch priority; POST /faces (darkroom's age check) asks for
# interactive. No kind is preemptible: a lease covers one image or one batch.
#
# No residents: curator has no /admin/unload route yet, so the broker cannot free
# its models.
tenant_version: "1.0"
tenant: argus-curator
description: Dataset curation for LoRA and voice training sets (faces, scenes, garments, embeddings, speech MOS and speaker embeddings on CUDA).
repo: smk762/argus-curator
# In-process work runs on the GPU of the host curator runs on. Change this if
# curator is deployed on another node.
node: morpheus
kinds:
  - kind: faces
    description: InsightFace buffalo_l with MiVOLO and FairFace, plus the body detector.
    vram_mb: 1600
    model_mb: 1000
    priority: batch
  - kind: scenes
    description: Places365 scene tags, up to 16 images per batch.
    vram_mb: 656
    model_mb: 400
    priority: batch
  - kind: garments
    description: Fashionpedia garment detector.
    vram_mb: 1268
    model_mb: 500
    priority: batch
  - kind: embeddings
    description: CLIP ViT-L/14 (DataComp-1B) image tower, semantic embeddings in batches of 8.
    vram_mb: 1984
    model_mb: 1600
    priority: batch
  - kind: mos
    description: DNSMOS P.835 speech quality for speech scans, one 9.01 s window per pass.
    vram_mb: 684
    model_mb: 300
    priority: batch
  - kind: speakers
    description: WeSpeaker ECAPA-TDNN speaker embeddings for speech scans, one clip's 4 windows of 3 s per pass, and with second_voice its speech in passes of 8 windows of 1.5 s (no more frames).
    vram_mb: 542
    model_mb: 350
    priority: batch
  - kind: language
    description: SpeechBrain VoxLingua107 ECAPA-TDNN spoken language ID for speech scans, one clip's 3 windows of 6 s per pass.
    vram_mb: 912
    model_mb: 400
    priority: batch
