[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-curator"
dynamic = ["version"]
description = "Image and speech curation and moderation: quality scoring, near-duplicate dedup, face clustering, and apparent-age, scene and garment tagging with auditable filters; standalone or as LoRA and voice data prep"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
keywords = [
    "curation", "dataset", "lora", "training", "diffusion",
    "image-quality", "deduplication", "phash", "face-clustering",
    "insightface", "stable-diffusion", "flux", "sdxl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "ImageHash>=4.3",
    "pydantic>=2.7",
    "structlog>=24.0",
    # The NudeNet / SingGuard clients and their result types (argus_cortex.moderation),
    # shared across the suite. Its base install is pydantic-only. The <0.13 cap is
    # deliberate: argus-cortex is pre-1.0, where a minor bump carries no
    # compatibility guarantee.
    "argus-cortex>=0.14,<0.15",
]

[project.optional-dependencies]
# httpx powers the optional export -> argus-lens caption handoff (_post_manifest_to_lens).
# argus-cortex[server] adds the shared write-guard (argus_cortex.server), imported only
# by server/app.py — hence this extra, so an engine/CLI-only install skips starlette.
# Its [server] extra pulls starlette; fastapi
# provides it too, but declaring it keeps the constraint honest. fastapi>=0.110.1 is the
# first release requiring starlette>=0.37 — 0.110.0 pins starlette<0.37 and so cannot be
# resolved alongside argus-cortex[server]. The cap matches the base dependency's;
# this is security-critical middleware resolved fresh on every Docker build.
server = [
    "fastapi>=0.110.1",
    "uvicorn>=0.27",
    "python-multipart>=0.0.7",
    "httpx>=0.27",
    # httpx verifies against certifi. 2026.10.19 drops emSign ECC Root CA - G3.
    "certifi>=2026.10.19",
    # [remote,yaml]: the argus-iris broker client and gpu-tenant.yaml. /health builds the
    # GPU coordinator, so a CPU server with ARGUS_GPU_COORDINATOR=broker needs them too.
    "argus-cortex[server,remote,yaml]>=0.14,<0.15",
]
cli = ["typer>=0.12", "rich>=13.0"]
gpu = [
    # NVML, for the shared GPU lease's free-VRAM wait (argus_cortex.gpu); httpx and
    # PyYAML for the argus-iris broker client and gpu-tenant.yaml (argus_cortex.gpu_broker).
    "argus-cortex[gpu,remote,yaml]>=0.14,<0.15",
    "insightface>=2.1,<3",
    # insightface's face alignment calls SimilarityTransform.estimate, which
    # scikit-image removes in 2.2.
    "scikit-image<2.2",
    "onnxruntime-gpu>=1.16",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.3",
]
faces = [
    "insightface>=2.1,<3",
    "scikit-image<2.2",  # see [gpu]
    "onnxruntime>=1.16",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.3",
]
# One-time conversion of the FairFace PyTorch weights to ONNX
# (`argus-curator fairface-convert`). Inference itself only needs [faces].
fairface-convert = ["torch>=2.5", "torchvision>=0.20", "onnx>=1.16"]
# Same for MiVOLO (`argus-curator mivolo-convert`); the dynamo exporter needs onnxscript.
mivolo-convert = [
    "torch>=2.6",
    "timm>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "onnx>=1.16",
    "onnxscript>=0.2",
]
# Places365 scene tags run on onnxruntime alone (already part of [faces]).
scenes = ["onnxruntime>=1.16"]
places365-convert = ["torch>=2.5", "torchvision>=0.20", "onnx>=1.16"]
garments-convert = [
    "torch>=2.6",
    "transformers>=4.45",
    "huggingface_hub>=0.23",
    "onnx>=1.16",
    "onnxscript>=0.2",
]
# One-time export of the CLIP image tower (`argus-curator embeddings-convert`);
# --embeddings itself runs on onnxruntime alone, like scenes. Uses the legacy
# TorchScript exporter, so no onnxscript.
embeddings-convert = [
    "torch>=2.6",
    "transformers>=4.45",
    "huggingface_hub>=0.23",
    "onnx>=1.16",
]
# One-time export of SpeechBrain's VoxLingua107 language-ID model (`argus-curator
# lid-convert`, #208); --language-id itself runs on onnxruntime alone ([speech]).
# Uses the legacy TorchScript exporter, so no onnxscript.
lid-convert = [
    "torch>=2.6",
    "speechbrain>=1.0",
    "huggingface_hub>=0.23",
    "onnx>=1.16",
]
# Speech scans (#186): WAV/FLAC decoding through argus_cortex.limits.open_audio
# (soundfile, which bundles libsndfile), and onnxruntime for the optional DNSMOS
# score (`argus-curator dnsmos-fetch`). Everything else is numpy.
speech = ["argus-cortex[audio]>=0.14,<0.15", "onnxruntime>=1.16"]
# Composed from the extras above rather than hand-duplicating them, so a new
# member of `server`/`cli`/`faces` cannot silently go missing from `all`.
all = ["argus-curator[server,cli,faces,speech]"]
# argus-cortex[audio] (soundfile) so the speech scan's tests decode real WAVs
# in CI, which installs only [dev,server,cli]; no model or GPU is needed.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
    "httpx2>=2.7",
    "certifi>=2026.10.19",
    "argus-cortex[audio]>=0.14,<0.15",
]

[project.scripts]
argus-curator = "argus_curator.cli:app"

[project.urls]
Homepage = "https://github.com/smk762/argus-curator"
Repository = "https://github.com/smk762/argus-curator"
Issues = "https://github.com/smk762/argus-curator/issues"
Changelog = "https://github.com/smk762/argus-curator/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_curator/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_curator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID251"]
ignore = ["E501", "B008"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# NudeNet is AGPL-3.0: it runs as a separate server (argus-retina) and curator only talks to it over HTTP,
# through argus_cortex.moderation.NudeNetClient. Importing it would pull AGPL code into this package.
"nudenet".msg = "NudeNet is AGPL-3.0; call the NudeNet server through argus_cortex.moderation.NudeNetClient instead."
