[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-curator"
dynamic = ["version"]
description = "Image curation and moderation: quality scoring, near-duplicate dedup, face clustering, and apparent-age, scene and garment tagging with auditable filters; standalone or as LoRA data prep"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
keywords = [
    "curation", "dataset", "lora", "training", "diffusion",
    "image-quality", "deduplication", "phash", "face-clustering",
    "insightface", "stable-diffusion", "flux", "sdxl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "ImageHash>=4.3",
    "pydantic>=2.6",
    "structlog>=24.0",
    # The NudeNet / SingGuard clients and their result types (argus_cortex.moderation),
    # shared across the suite. Its base install is pydantic-only. The <0.5 cap is
    # deliberate: argus-cortex is pre-1.0, where a minor bump carries no
    # compatibility guarantee.
    "argus-cortex>=0.4.5,<0.5",
]

[project.optional-dependencies]
# httpx powers the optional export -> argus-lens caption handoff (_post_manifest_to_lens).
# argus-cortex[server] adds the shared write-guard (argus_cortex.server), imported only
# by server/app.py — hence this extra, so an engine/CLI-only install skips starlette.
# Its [server] extra pulls starlette; fastapi
# provides it too, but declaring it keeps the constraint honest. fastapi>=0.110.1 is the
# first release requiring starlette>=0.37 — 0.110.0 pins starlette<0.37 and so cannot be
# resolved alongside argus-cortex[server]. The cap matches the base dependency's;
# this is security-critical middleware resolved fresh on every Docker build.
server = [
    "fastapi>=0.110.1",
    "uvicorn>=0.27",
    "python-multipart>=0.0.7",
    "httpx>=0.27",
    # httpx verifies against certifi. 2026.10.19 drops emSign ECC Root CA - G3.
    "certifi>=2026.10.19",
    "argus-cortex[server]>=0.4.5,<0.5",
]
cli = ["typer>=0.12", "rich>=13.0"]
gpu = [
    # NVML, for the shared GPU lease's free-VRAM wait (argus_cortex.gpu).
    "argus-cortex[gpu]>=0.4.5,<0.5",
    "insightface>=2.1,<3",
    # insightface's face alignment calls SimilarityTransform.estimate, which
    # scikit-image removes in 2.2.
    "scikit-image<2.2",
    "onnxruntime-gpu>=1.16",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.3",
]
faces = [
    "insightface>=2.1,<3",
    "scikit-image<2.2",  # see [gpu]
    "onnxruntime>=1.16",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.3",
]
# One-time conversion of the FairFace PyTorch weights to ONNX
# (`argus-curator fairface-convert`). Inference itself only needs [faces].
fairface-convert = ["torch>=2.5", "torchvision>=0.20", "onnx>=1.16"]
# Same for MiVOLO (`argus-curator mivolo-convert`); the dynamo exporter needs onnxscript.
mivolo-convert = [
    "torch>=2.6",
    "timm>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "onnx>=1.16",
    "onnxscript>=0.2",
]
# Places365 scene tags run on onnxruntime alone (already part of [faces]).
scenes = ["onnxruntime>=1.16"]
places365-convert = ["torch>=2.5", "torchvision>=0.20", "onnx>=1.16"]
garments-convert = [
    "torch>=2.6",
    "transformers>=4.45",
    "huggingface_hub>=0.23",
    "onnx>=1.16",
    "onnxscript>=0.2",
]
# Composed from the extras above rather than hand-duplicating them, so a new
# member of `server`/`cli`/`faces` cannot silently go missing from `all`.
all = ["argus-curator[server,cli,faces]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27", "httpx2>=2.7", "certifi>=2026.10.19"]

[project.scripts]
argus-curator = "argus_curator.cli:app"

[project.urls]
Homepage = "https://github.com/smk762/argus-curator"
Repository = "https://github.com/smk762/argus-curator"
Issues = "https://github.com/smk762/argus-curator/issues"
Changelog = "https://github.com/smk762/argus-curator/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_curator/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_curator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
